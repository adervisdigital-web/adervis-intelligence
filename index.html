<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; media-src https://*.supabase.co; font-src 'self' https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>Hub ADERVIS</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form class="card gatecard" id="gateform">
    <div class="brandmark">A</div>
    <b>HUB ADERVIS</b>
    <p class="muted">Общая база знаний компании. Вход для сотрудников ADERVIS.</p>
    <label for="gate-email">Почта</label>
    <input id="gate-email" name="email" type="email" required autocomplete="username">
    <label for="gate-pass">Пароль</label>
    <input id="gate-pass" name="password" type="password" required autocomplete="current-password">
    <div class="gaterow">
      <label class="task"><input type="checkbox" id="remember" checked> Запомнить меня</label>
      <button type="button" class="link" id="showpass">Показать</button>
    </div>
    <p class="gateerror" id="gateerror" role="alert"></p>
    <button class="primary" id="gatebtn">Войти</button>
    <p class="muted gatehint">Вход сохраняется на этом устройстве: пароль спросят снова только после кнопки «Выйти».</p>
  </form>
</div>

<div class="app" id="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brandmark">A</div>
      <div><b>HUB</b><small>ADERVIS</small></div>
      <button class="railbtn" id="rail" aria-label="Свернуть меню" title="Свернуть меню"></button>
    </div>
    <button class="navsearch" id="navsearch" title="Поиск — Ctrl K"></button>
    <nav class="nav" id="nav"></nav>
    <div class="bottom">
      <div class="user"><div class="avatar" id="avatar"></div><div class="who"><b id="myname"></b><small id="myemail"></small></div></div>
      <div class="useracts">
        <button class="sbact" id="sbtheme" aria-label="Сменить тему" title="Сменить тему"></button>
        <button class="sbact" data-page="settings" aria-label="Настройки" title="Настройки" id="sbsettings"></button>
        <button class="sbact out" data-action="signout" aria-label="Выйти" title="Выйти" id="sbout"></button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="iconbtn mobile" id="menu" aria-label="Меню">☰</button>
      <div class="crumb">ADERVIS / <b id="crumb">Обзор</b></div>
      <div class="top-actions">
        <button class="search" id="search">⌕ Поиск<span class="kbd"> &nbsp; Ctrl K</span></button>
        <button class="iconbtn" id="refresh" aria-label="Обновить данные">⟳</button>
        <button class="iconbtn" id="theme" aria-label="Тема">◐</button>
        <button class="primary" id="create">+ Создать</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Главные разделы"></nav>
</div>

<dialog id="modal"></dialog>
<input type="file" id="importfile" accept=".json" hidden>
<div id="alerts" aria-live="polite"></div>

<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="icons-data.js"></script>
<script src="survey-data.js"></script>
<script src="survey-2-data.js"></script>
<script src="survey-3-data.js"></script>
<script src="app.js"></script>
</body>
</html>
